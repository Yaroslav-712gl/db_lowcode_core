services:

  meta-db:
    image: postgres:16-alpine
    container_name: meta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${META_DB_NAME:-metadb}
      POSTGRES_USER: ${META_DB_USER:-metauser}
      POSTGRES_PASSWORD: ${META_DB_PASSWORD}
    volumes:
      - meta_db_data:/var/lib/postgresql/data
      - ./meta-db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${META_DB_USER:-metauser} -d ${META_DB_NAME:-metadb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    depends_on:
      meta-db:
        condition: service_healthy
    environment:
      META_DB_URL: postgresql+asyncpg://${META_DB_USER:-metauser}:${META_DB_PASSWORD}@meta-db:5432/${META_DB_NAME:-metadb}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  meta_db_data:
