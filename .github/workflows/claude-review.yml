name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/main...HEAD > diff.txt
          cat diff.txt | claude -p "
            Ты ревьюер кода для проекта db_lowcode_core.
            Это low-code платформа на FastAPI + Vue 3 для работы с legacy БД.
            
            Проверь diff на:
            1. Баги и логические ошибки
            2. Безопасность (особенно SQL injection, утечки секретов)
            3. Соответствие архитектуре (не должно быть прямых запросов к legacy DB минуя repositories)
            4. Типизацию (Python type hints, TypeScript strict)
            
            Будь конкретен, указывай файл и строку. Отвечай на русском." \
            --allowedTools "Read,Grep" \
            --output-format json \
            --max-turns 5 > review.json

      - name: Post Review Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(cat review.json | jq -r '.result')
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🤖 Claude Code Review

          $RESULT"
